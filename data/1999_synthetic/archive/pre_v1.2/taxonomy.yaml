labels:
  - label_id: "sidewalk_maintenance"
    label_name: "人行道維護"
    official_parent: "道路、山坡地、路樹及路燈"
    official_subcategory: "人行道維護"
    latest_month_match_rows: 568
    include:
      - "人行道鋪面、地磚、導盲磚或緣石本體破損、鬆動、沉陷、高低差等維護問題。"
      - "通行表面本身狀況不佳，且主要訴求是修復或維護人行道。"
    exclude:
      - "車行道凹陷或不平，改列道路凹陷、不平、有高低差。"
      - "移動式物品、違停或施工圍設造成的占用或阻路；依其案件性質另行分類。"
      - "排水溝、孔蓋本體故障；不要僅因位置在人行道就納入。"
    confusing_rules:
      - "若問題位於人行道且描述的是人行道鋪面，採本類；若明確是車行道面，採道路凹陷、不平、有高低差。"
      - "導盲磚本體破損屬本類；被外物遮擋則不描述成鋪面維護案件。"
    scenario_families:
      - scenario_family_id: "FAM-SW-TILE-MOVEMENT"
