    case_core: 公共果皮箱本體故障導致周圍散落垃圾。
    variation_axes: 內桶、箱蓋、箱身固定狀況及垃圾漏出的方向。
    inclusion_and_exclusion_boundary: 單純容量滿溢歸果皮箱滿溢；私人垃圾桶不列公共清潔。 合併分流：原 FAM-CLEAN-WIND-DISPERSED-LITTER 只有在能確認由果皮箱損壞造成時才歸本家族。
    source_status: 既有
