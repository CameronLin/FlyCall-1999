revision_notes:
- v1.2.1 由既有 pilot_v1.2.jsonl 與 taxonomy_v1.2.yaml 接續修訂，保留 v1.1 與 v1.2 原檔。
- 修正 V12-028、V12-048、V12-049、V12-050 的語句或時序問題，以及 V12-013、V12-018、V12-030 的客服收尾用語。
- 全批位置改用行政區與公共空間相對位置描述，移除門牌、具名路口組合及可直接定位的地址細節；未新增真實路口或地標。
- 調整追問次序、補充方式與客服收尾，保留原標籤、情境家族配置及每筆單一主要問題。
- Pilot v1.2.1 沿用 v1.1 官方類別名稱與主類別核對來源。
- 開場客服使用不提示主題的中性問候；來電者描述後，客服只針對已提供資訊釐清。
- 逐字稿每筆至少 280 個中文字，目標 300–400 字；約 10–14 行 R/L 發言。
- 自動關鍵字掃描不能完全判斷語意洩漏或家族內情境差異，須人工複核。
- v1.3 依使用者於 2026-10-12 採納的助理獨立複核決定 v1.0 建立正式 taxonomy；保留全部舊版草案。
- 套用 18 個情境家族界線修訂、9 個 merge；活動家族共 66 個，五類為 14／14／15／12／11。
- 正式資料另新增 1,000 筆，Pilot 50 筆獨立，不納入正式配額。
