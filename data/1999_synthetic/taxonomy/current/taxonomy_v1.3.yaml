labels:
- label_id: sidewalk_maintenance
  label_name: 人行道維護
  official_parent: 道路、山坡地、路樹及路燈
  official_subcategory: 人行道維護
  latest_month_match_rows: 568
  include:
  - 人行道鋪面、地磚、導盲磚或緣石本體破損、鬆動、沉陷、高低差等維護問題。
  - 通行表面本身狀況不佳，且主要訴求是修復或維護人行道。
  exclude:
  - 車行道凹陷或不平，改列道路凹陷、不平、有高低差。
  - 移動式物品、違停或施工圍設造成的占用或阻路；依其案件性質另行分類。
  - 排水溝、孔蓋本體故障；不要僅因位置在人行道就納入。
  confusing_rules:
  - 若問題位於人行道且描述的是人行道鋪面，採本類；若明確是車行道面，採道路凹陷、不平、有高低差。
  - 導盲磚本體破損屬本類；被外物遮擋則不描述成鋪面維護案件。
  scenario_families:
  - scenario_family_id: FAM-SW-TILE-MOVEMENT
    name: 鋪面磚踩踏晃動、裂開或翹角
    case_core: 鋪面磚踩踏晃動、裂開或翹角。
    variation_axes: 一片或連片、踩踏是否移動、碎屑與輪子卡滯。
    inclusion_and_exclusion_boundary: 只談人行鋪面；車行道列道路不平，外物阻路不列鋪面維護。
    source_status: 既有
    source_decision: pass
    taxonomy_status: approved_existing
    active: true
  - scenario_family_id: FAM-SW-TACTILE-PAVING
    name: 導盲磚缺段、破裂或翹起
    case_core: 導盲磚缺段、破裂或翹起。
    variation_axes: 中斷長度、導引或提醒功能、雨天辨識與行走影響。
    inclusion_and_exclusion_boundary: 磚體本身受損才屬本家族；被物品遮住屬占用／清除問題。
    source_status: 既有
    source_decision: pass
    taxonomy_status: approved_existing
    active: true
  - scenario_family_id: FAM-SW-RAMP-SURFACE
    name: 人行坡道表面裂損或止滑磨耗
    case_core: 人行坡道表面裂損或止滑磨耗。
    variation_axes: 坡上／坡下、輪子卡滯、濕滑與止滑紋狀況。
    inclusion_and_exclusion_boundary: 限人行坡道表面；一般平面磨耗可列平面鋪面候選家族。
    source_status: 既有
    source_decision: pass
    taxonomy_status: approved_existing
    active: true
  - scenario_family_id: FAM-SW-LEVEL-SETTLEMENT
    name: 人行通行面沉陷或相鄰鋪面形成落差
    case_core: 人行通行面沉陷或相鄰鋪面形成落差。
    variation_axes: 凹陷範圍、雨後積水、不同方向通行感受。
    inclusion_and_exclusion_boundary: 若是車行表面列道路；若是坡道落地平台幾何問題，考慮坡道平台家族。 納入變化：原 FAM-SW-DRIVEWAY-CROSSING 的出入口銜接高低差仍須是公共人行通行面沉陷／落差。
    source_status: 既有
    source_decision: pass
    taxonomy_status: approved_existing
    active: true
  - scenario_family_id: FAM-SW-CURB-EDGE
    name: 人行道緣石本體裂損、鬆動或突出
    case_core: 人行道緣石本體裂損、鬆動或突出。
    variation_axes: 石塊是否移位、尖角、行人或輪胎接觸。
    inclusion_and_exclusion_boundary: 緣石本體為主訴；相鄰車行鋪面破損列道路。
    source_status: 既有
    source_decision: pass
    taxonomy_status: approved_existing
    active: true
  - scenario_family_id: FAM-SW-CONCRETE-SPALLING
    name: 整體混凝土人行面表層剝落、露出骨材，但不是單片磚鬆動
    case_core: 整體混凝土人行面表層剝落、露出骨材，但不是單片磚鬆動。
    variation_axes: 剝落層是否仍附著、粗糙範圍、是否有尖銳碎屑及輪椅通行影響。
    inclusion_and_exclusion_boundary: 與磚體移動／破裂區分；若是車道或施工中剝除面，排除本類。
    source_status: 候選新增
    source_decision: pass
    taxonomy_status: approved_candidate
    active: true
  - scenario_family_id: FAM-SW-UTILITY-RESTORATION
    name: 公共人行道管線開挖回填後，回復面下陷或接合不良
    case_core: 公共人行道管線開挖回填後，回復面下陷或接合不良。
    variation_axes: 回填區輪廓、沉陷是否只在回填帶、輪子通過反應。
    inclusion_and_exclusion_boundary: 保留須有可觀察的開挖回填帶及其表面沉陷／接合缺陷；只描述一般沉陷時歸 FAM-SW-LEVEL-SETTLEMENT。
    source_status: 候選新增（邊界修訂草案）
    source_decision: revise
    taxonomy_status: approved_revised_candidate
    active: true
  - scenario_family_id: FAM-SW-SLAB-JOINT-GAP
    name: 相鄰固定板塊接縫張開，形成窄縫而非大面積沉陷
    case_core: 相鄰固定板塊接縫張開，形成窄縫而非大面積沉陷。
    variation_axes: 縫寬、手杖／鞋跟／小輪卡入、接縫是否延長。
    inclusion_and_exclusion_boundary: 整片晃動歸鋪面磚家族；明顯垂直高差歸沉陷家族。
    source_status: 候選新增
    source_decision: pass
    taxonomy_status: approved_candidate
    active: true
  - scenario_family_id: FAM-SW-CURB-RAMP-LANDING
    name: 無障礙坡道頂端或平台的平面幾何、坡向或轉向空間設計缺陷，使停留或轉向不穩
    case_core: 無障礙坡道頂端或平台的平面幾何、坡向或轉向空間設計缺陷，使停留或轉向不穩。
    variation_axes: 平台坡向、轉彎空間、輪椅停留及接回人行面方式。
    inclusion_and_exclusion_boundary: 限坡道頂端或平台的平面幾何、坡向或轉向空間缺陷；排除坡面材料破損及一般鋪面沉陷。
    source_status: 候選新增（邊界修訂草案）
    source_decision: revise
    taxonomy_status: approved_revised_candidate
    active: true
  - scenario_family_id: FAM-SW-TACTILE-ALIGNMENT
    name: 導盲磚完整但排列方向或連續路徑在交界處錯接
    case_core: 導盲磚完整但排列方向或連續路徑在交界處錯接。
    variation_axes: 使用者由哪方向接近、直行／轉向選擇、斷續位置。
    inclusion_and_exclusion_boundary: 有裂損或缺磚歸導盲磚破損；被外物遮擋不歸此類。
    source_status: 候選新增
    source_decision: pass
    taxonomy_status: approved_candidate
    active: true
  - scenario_family_id: FAM-SW-FLAT-SURFACE-SLIPPERY
    name: 平坦公共人行鋪面長期磨光，乾濕轉換時摩擦不足
    case_core: 平坦公共人行鋪面長期磨光，乾濕轉換時摩擦不足。
    variation_axes: 乾燥與潮濕差異、磨光範圍、行人是否放慢。
    inclusion_and_exclusion_boundary: 限固定平面鋪面長期磨光造成的乾濕摩擦差；排除液體／泥污，並明確與 FAM-SW-RAMP-SURFACE 區分。
    source_status: 候選新增（邊界修訂草案）
    source_decision: revise
    taxonomy_status: approved_revised_candidate
    active: true
  - scenario_family_id: FAM-SW-MISSING-PAVERS
    name: 一片或一段鋪面磚完全缺失，留下空穴
    case_core: 一片或一段鋪面磚完全缺失，留下空穴。
    variation_axes: 空穴深度、邊緣、是否有磚塊留在旁邊及避讓方式。
    inclusion_and_exclusion_boundary: 磚仍在但鬆動／破裂歸既有鋪面磚家族；孔蓋或管線孔洞排除。
    source_status: 候選新增
    source_decision: pass
    taxonomy_status: approved_candidate
    active: true
  - scenario_family_id: FAM-SW-EDGE-CRUMBLING
    name: 人行鋪面靠外側邊界自身崩碎，與緣石本體故障不同
    case_core: 人行鋪面靠外側邊界自身崩碎，與緣石本體故障不同。
    variation_axes: 崩落長度、碎塊是否鬆脫、外側是否仍可安全通行。
    inclusion_and_exclusion_boundary: 界定為人行鋪面外緣本體碎裂；排除緣石本體破損與平面表層剝落，避免與 FAM-SW-CONCRETE-SPALLING 混用。
    source_status: 候選新增（邊界修訂草案）
    source_decision: revise
    taxonomy_status: approved_revised_candidate
    active: true
  - scenario_family_id: FAM-SW-PEDESTRIAN-DECK
    name: 公共人行橋或架高通道的踏板／面板鬆動、翹起或有縫
    case_core: 公共人行橋或架高通道的踏板／面板鬆動、翹起或有縫。
    variation_axes: 踏板是否彈動、縫隙位置、步行與輪椅受影響方式。
    inclusion_and_exclusion_boundary: 限定公共人行橋或架高通道的行走面板缺陷；明確排除園內一般步道及橋體結構安全問題。
    source_status: 候選新增（邊界修訂草案）
    source_decision: revise
    taxonomy_status: approved_revised_candidate
    active: true
- label_id: road_surface_defect
  label_name: 道路凹陷、不平、有高低差
  official_parent: 道路、山坡地、路樹及路燈
  official_subcategory: 道路凹陷、不平、有高低差
  latest_month_match_rows: 435
  include:
  - 車行道路面凹陷、隆起、破損、不平或前後路面形成高低差。
  - 主要訴求為道路表面修復或確認路面維護。
  exclude:
  - 人行道鋪面問題，改列人行道維護。
  - 溝蓋遺失、鬆動或被打開；不要以路面不平混併溝蓋本體問題。
  - 交通號誌、標線或交通事故等非路面維護主訴。
  confusing_rules:
  - 依實際受損的表面判斷：人行通行鋪面為人行道維護，車行道路面為本類。
  - 若主要問題是孔蓋或排水設施本身，排除於本類，即使周邊路面有落差。
  scenario_families:
  - scenario_family_id: FAM-ROAD-INTERSECTION-DENT
    name: 路口或轉彎區局部下陷
    case_core: 路口或轉彎區局部下陷。
    variation_axes: 凹處相對停止線／轉彎車道、雨水遮蔽、車輛避讓。
    inclusion_and_exclusion_boundary: 確認是車行道；孔蓋或排水設施本體故障不歸此類。 納入變化：原 FAM-ROAD-CROSSING-APPROACH 的停靠／穿越位置前局部凹陷，以相對位置描述，不另立家族。
    source_status: 既有
    source_decision: pass
    taxonomy_status: approved_existing
    active: true
  - scenario_family_id: FAM-ROAD-WHEEL-TRACK
    name: 車輪常行位置形成縱向輪跡槽
    case_core: 車輪常行位置形成縱向輪跡槽。
    variation_axes: 慢車道或主車道、槽深變化、車輛方向修正。
    inclusion_and_exclusion_boundary: 不以位置替換創建新家族；單一道接縫落差歸接縫家族。
    source_status: 既有
    source_decision: pass
    taxonomy_status: approved_existing
    active: true
  - scenario_family_id: FAM-ROAD-REPAIR-JOINT
    name: 補面或施工接縫未與原路面接平
    case_core: 補面或施工接縫未與原路面接平。
    variation_axes: 橫向／斜向接縫、先上後下震動、補面中段是否平整。
    inclusion_and_exclusion_boundary: 補面整片碎裂歸補面破損候選；管線孔蓋本體故障排除。
    source_status: 既有
    source_decision: pass
    taxonomy_status: approved_existing
    active: true
  - scenario_family_id: FAM-ROAD-LONGITUDINAL-TRANSITION
    name: 車行道上可辨識的單一線狀接合／轉換帶形成高低差
    case_core: 車行道上可辨識的單一線狀接合／轉換帶形成高低差。
    variation_axes: 接合帶方向與範圍、車輛通過時是否出現一次明確震動。
    inclusion_and_exclusion_boundary: 目前「長條或斜向高低轉換」與廣泛波狀起伏、局部隆起界線重疊；收斂為可辨識的單一線狀接合／轉換帶，並排除廣域波動與片狀隆起。與 FAM-ROAD-WIDESPREAD-UNDULATION 同 split，避免相近情境跨資料集。
    source_status: 既有（邊界修訂草案）
    source_decision: revise
    taxonomy_status: approved_existing
    active: true
  - scenario_family_id: FAM-ROAD-DEEP-POTHOLE
    name: 具明顯深度、邊緣破碎的單一坑洞，車輪會撞擊或急閃
    case_core: 具明顯深度、邊緣破碎的單一坑洞，車輪會撞擊或急閃。
    variation_axes: 坑口形狀、深淺可見度、輪胎衝擊及散落碎石。
    inclusion_and_exclusion_boundary: 與淺小局部凹陷區分以坑洞形態／風險而非只看地點；孔蓋故障排除。
    source_status: 候選新增
    source_decision: pass
    taxonomy_status: approved_candidate
    active: true
