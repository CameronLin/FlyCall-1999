- label_id: street_cleaning
  label_name: 路面清潔（含行人果皮箱、菸蒂、狗便）
  official_parent: 垃圾、噪音、污染及資源回收
  official_subcategory: 路面清潔（含行人果皮箱、菸蒂、狗便）
  latest_month_match_rows: 583
  include:
  - 公共路面清掃、行人果皮箱滿溢或周邊散落、菸蒂、狗便等路面清潔問題。
  - 主要訴求是公共空間髒污清理或清潔維護。
  exclude:
  - 垃圾車收運時段、路線或漏收，改列垃圾車清運及服務事項。
  - 私人室內或私人土地清潔；不要描述成公共路面案件。
  - 廢棄物違規棄置等以稽查或廢棄物處理為主的案件。
  confusing_rules:
  - 路面或公共果皮箱周邊清潔屬本類；收運車未到或路線服務問題屬垃圾車清運及服務事項。
  - 使用明確公共空間作為場景；若地點或權責範圍不清，列入人工複核。
  scenario_families:
  - scenario_family_id: FAM-CLEAN-BIN-OVERFLOW
    name: 公共果皮箱容量滿溢，垃圾堆到箱外或箱口
    case_core: 公共果皮箱容量滿溢，垃圾堆到箱外或箱口。
    variation_axes: 外溢量、持續多久、行人是否需要繞行。
    inclusion_and_exclusion_boundary: 箱體部件損壞造成漏出歸果皮箱損壞；家用垃圾收運問題列垃圾車服務。 合併分流：原 FAM-CLEAN-WIND-DISPERSED-LITTER 只有在能確認由果皮箱滿溢造成時才歸本家族。
    source_status: 既有
    source_decision: pass
    taxonomy_status: approved_existing
    active: true
