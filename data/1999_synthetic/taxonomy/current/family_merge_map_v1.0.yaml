- source_family_id: FAM-WASTE-SCHEDULED-DAY-OMISSION
  target_rule: 單一固定停靠點／住戶未服務 → FAM-WASTE-MISSED-STOP；連續街廓／整段路線未服務 → FAM-WASTE-ROUTE-SEGMENT-OMISSION。
  target_family_ids:
  - FAM-WASTE-MISSED-STOP
  - FAM-WASTE-ROUTE-SEGMENT-OMISSION
  routing_rule: 以來電者觀察的未服務範圍判定；不得僅憑單戶推估整段未服務。
- source_family_id: FAM-WASTE-TEMP-STOP-RELOCATION
  target_rule: FAM-WASTE-STOP-LOCATION
  target_family_ids:
  - FAM-WASTE-STOP-LOCATION
  routing_rule: 臨時停靠點移動屬停靠位置資訊變動。
- source_family_id: FAM-WASTE-RECYCLABLE-STREAM-SERVICE
  target_rule: 唯一主要訴求是到達時段 → FAM-WASTE-ARRIVAL-TIME；未見車輛停靠 → FAM-WASTE-MISSED-STOP；等候位置改變或不明 → FAM-WASTE-STOP-LOCATION。
  target_family_ids:
  - FAM-WASTE-ARRIVAL-TIME
  - FAM-WASTE-MISSED-STOP
  - FAM-WASTE-STOP-LOCATION
  routing_rule: 必須只選一個主要服務問題；排除回收物分類、袋別或政策諮詢。若主要訴求同時不止一項，該筆不生成。
- source_family_id: FAM-CLEAN-EVENT-PACKAGING
  target_rule: FAM-CLEAN-SURFACE-DEBRIS
  target_family_ids:
  - FAM-CLEAN-SURFACE-DEBRIS
  routing_rule: 活動後包裝與紙屑作為一般公共路面散落物的來源變化，不獨立成家族。
- source_family_id: FAM-CLEAN-WIND-DISPERSED-LITTER
  target_rule: 一般散落物／來源不明 → FAM-CLEAN-SURFACE-DEBRIS；確認因果皮箱滿溢外漏 → FAM-CLEAN-BIN-OVERFLOW；確認因箱體破損外漏 → FAM-CLEAN-BIN-DAMAGE。
  target_family_ids:
  - FAM-CLEAN-SURFACE-DEBRIS
  - FAM-CLEAN-BIN-OVERFLOW
  - FAM-CLEAN-BIN-DAMAGE
  routing_rule: 只能根據可觀察的散落物與果皮箱狀態分流；僅有風或來電者猜測，不足以推定箱體為來源。
- source_family_id: FAM-CLEAN-GUM-ADHERED-RESIDUE
  target_rule: FAM-CLEAN-SURFACE-DEBRIS
  target_family_ids:
  - FAM-CLEAN-SURFACE-DEBRIS
  routing_rule: 黏著殘留是一般路面髒污的污物型態，不另立服務家族。
- source_family_id: FAM-CLEAN-DOG-WASTE-PERSISTENT-RESIDUE
  target_rule: 新出現或不同位置的狗便清理 → FAM-CLEAN-DOG-WASTE；同一舊痕已清掃但仍留存 → FAM-CLEAN-POST-SWEEP-RESIDUE。
  target_family_ids:
  - FAM-CLEAN-DOG-WASTE
  - FAM-CLEAN-POST-SWEEP-RESIDUE
  routing_rule: 只有明確確認是同一處既有污痕且經過清掃仍殘留時，才分流至 POST-SWEEP；未確認時歸 DOG-WASTE，不推測清掃歷史。
