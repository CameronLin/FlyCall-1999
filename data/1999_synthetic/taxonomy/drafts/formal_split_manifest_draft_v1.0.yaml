pre_freeze_checks:
  - "人工核准 75 個家族的邊界；重疊家族合併後重算，不以保留 15 個為硬性條件。"
  - "覆核同類易混淆家族，確認概念近似家族同 split；如調整，保留每類 200 筆且不得跨 split。"
  - "核准每類 9/3/3 家族代表性；validation/test 各僅 3 個家族，結果只代表有限家族樣本。"
  - "pilot 50 筆人工複核完成並有明確通過紀錄。"
  - "凍結 taxonomy、manifest、ID、prompt、模型和批次規格後才可生成。"
