# Split manifest 草案 v1.0 — 未凍結
# 此檔只規劃未來新增的正式 1,000 筆，不含也不合併 v1.2.1 pilot。
manifest_version: "draft-1.0"
status: draft_unfrozen
freeze_before_generation: true
formal_dataset_target: 1000
records_per_category: 200
pilot: 
  file: pilot_v1.2.1.jsonl
  records: 50
  split: pilot
  included_in_formal_target: false
  review_status: pending_manual_review
  generation_gate: "50 筆逐筆人工複核明確通過並留存記錄前，不得開始正式生成。"
recommended_split: "70/15/15"
split_policy:
  unit: scenario_family_id
  isolation: "每個 scenario_family_id 只指派到一個 split；不因配額拆分家族。"
  family_counts_per_category: {train: 9, validation: 3, test: 3}
  rationale: "維持足夠訓練量，同時將每類 validation/test 提高至 30 筆、各涵蓋 3 個未見家族。"
  draft_note: "家族仍待核准；若 taxonomy 合併、移除或新增，必須重新分配並核對數量，之後另行凍結。"
comparisons:
  - ratio: "80/10/10"
    per_category_records: {train: 160, validation: 20, test: 20}
    total_records: {train: 800, validation: 100, test: 100}
    families_per_category: {train: 9, validation: 3, test: 3}
    records_per_family_range: {train: "17-18", validation: "6-7", test: "6-7"}
    tradeoff: "訓練資料最多；train 每家族 17-18 筆、holdout 每家族 6-7 筆，約差 2.4-3 倍；每類 holdout 僅 20 筆且各只有 3 個家族，測試估計易受個別家族影響。"
  - ratio: "70/15/15"
    per_category_records: {train: 140, validation: 30, test: 30}
    total_records: {train: 700, validation: 150, test: 150}
    families_per_category: {train: 9, validation: 3, test: 3}
    records_per_family_range: {train: "15-16", validation: "10", test: "10"}
    tradeoff: "保留每類 140 筆訓練資料；train 每家族 15-16 筆、validation/test 每家族 10 筆，holdout 各 30 筆。"
  - ratio: "60/20/20"
    per_category_records: {train: 120, validation: 40, test: 40}
    total_records: {train: 600, validation: 200, test: 200}
    families_per_category: {train: 9, validation: 3, test: 3}
    records_per_family_range: {train: "13-14", validation: "13-14", test: "13-14"}
    tradeoff: "holdout 最大且各 split 每家族約 13-14 筆；每類只剩 120 筆訓練資料，可能削弱五類模型的學習量。"
