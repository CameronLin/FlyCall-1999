official_semantics:
  reference: "Berg S. et al., Cell 189(18), 5504-5526.e15 (2026), STAR Methods 'Assignment of neurotransmitter predictions', https://doi.org/10.1016/j.cell.2026.08.015 (read 2026-11-13)."
  summary:
    - "predictedNt is the most frequent presynapse prediction; bodies with < 50 presynaptic sites or predictedNtConfidence < 0.5 are unclear."
    - "celltypePredictedNt pools all cells of a type; types with < 100 presynapses or confidence < 0.5 are unclear."
    - "consensusNt copies celltypePredictedNt, overridden by experimental ground truth where available; octopamine and serotonin model results are set to unclear."
    - "The paper states consensusNt is the recommended property for most analyses."
project_decisions:
  label_column: consensus_nt
  extra_confidence_threshold: "none (the official unclear rules already apply a 0.5 confidence and presynapse-count floor)"
  sign_rules:
    acetylcholine: 1
    gaba: -1
    histamine: -1
    glutamate: {primary_sign_glu_inhibitory: -1, sensitivity_sign_glu_excitatory: 1}
    dopamine: excluded
    octopamine: excluded
    serotonin: excluded
    unclear_or_missing: excluded
    unknown_label: "hard failure; the mapping must be extended explicitly"
  sign_unit: "neuron (Dale's principle): every outgoing edge takes the source neuron's sign"
  rationale:
    glutamate: >-
      Shiu P.K. et al., "A Drosophila computational brain model reveals sensorimotor
      processing," Nature 634, 210-219 (2024), https://doi.org/10.1038/s41586-024-07763-9,
      Methods: assumes GABAergic and glutamatergic neurons are inhibitory by default,
      notes glutamate can be either sign in Drosophila, and separately tests glutamate
      as excitatory. This project mirrors that with a sensitivity variant. Difference:
      Shiu et al. assign dopamine/octopamine/serotonin to excitatory; this project excludes them.
    histamine: "Fast inhibitory transmission via histamine-gated chloride channels; decided -1 by the user on 2026-11-13."
